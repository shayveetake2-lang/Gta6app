<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1116" />
  <meta name="description" content="GTA6 Walkthrough — game walkthroughs, guides and community forum." />
  <title>GTA6 Walkthrough</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="topbar__inner container">
      <button class="icon-btn nav-toggle" id="navToggle" aria-expanded="false" aria-controls="primaryNav" aria-label="Open menu">
        <span class="burger" aria-hidden="true"></span>
      </button>

      <a class="brand" href="#/" data-route-link="/" aria-label="GTA6 Walkthrough — go to dashboard" title="Home">
        <span class="brand__mark" aria-hidden="true">G6</span>
        <span class="brand__text">GTA6 <b>Walkthrough</b></span>
      </a>

      <nav class="nav" id="primaryNav" aria-label="Primary">
        <ul class="nav__list">
          <li><a class="nav__link" href="#/" data-route-link="/">Home</a></li>
          <li><a class="nav__link" href="#/walkthroughs" data-route-link="/walkthroughs">Walkthroughs</a></li>
          <li><a class="nav__link" href="#/achievements" data-route-link="/achievements">Achievements</a></li>
          <li><a class="nav__link" href="#/forum" data-route-link="/forum">Forum</a></li>
          <li><a class="nav__link" href="#/accounts" data-route-link="/accounts">Accounts</a></li>
          <li><a class="nav__link" href="#/about" data-route-link="/about">About</a></li>
        </ul>
      </nav>

      <form class="search" role="search" id="globalSearch">
        <input type="search" id="globalSearchInput" placeholder="Search guides, achievements..." aria-label="Search guides, achievements" autocomplete="off" />
      </form>

      <div class="topbar__actions">
        <a class="profile-btn" href="#/profile/edit" aria-label="Edit your profile" title="Edit profile"><span aria-hidden="true">✎</span><span class="profile-btn__label">Profile</span></a>
        <button class="icon-btn" id="themeToggle" aria-label="Toggle color theme" title="Toggle theme">◐</button>
      </div>
    </div>
  </header>

  <div class="scrim" id="scrim" hidden></div>

  <main id="main" class="container" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Mobile">
    <a href="#/" data-route-link="/"><span class="tabbar__icon" aria-hidden="true">⌂</span>Home</a>
    <a href="#/walkthroughs" data-route-link="/walkthroughs"><span class="tabbar__icon" aria-hidden="true">▤</span>Guides</a>
    <a href="#/achievements" data-route-link="/achievements"><span class="tabbar__icon" aria-hidden="true">★</span>Achievements</a>
    <a href="#/forum" data-route-link="/forum"><span class="tabbar__icon tabbar__icon--chat" aria-hidden="true"></span>Forum</a>
    <a href="#/accounts" data-route-link="/accounts"><span class="tabbar__icon" aria-hidden="true">♙</span>Accounts</a>
  </nav>

  <footer class="footer">
    <div class="container footer__inner">
      <p>© <span id="year"></span> GTA6 Walkthrough — community-built guides.</p>
      <ul class="footer__links">
        <li><a href="#/about">About</a></li>
        <li><a href="#/forum">Forum</a></li>
      </ul>
    </div>
  </footer>

  <!-- Set window.ACHIEVEMENT_API_URL to the deployed achievement-API origin before going live.
       Leave blank to disable platform imports and show only the local tracker. -->
  <script>window.ACHIEVEMENT_API_URL = '';</script>
  <script type="module" src="js/app.js?v=10"></script>
</body>
</html>
